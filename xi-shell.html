<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>曦 · AI 生命壳</title>
<style>
  :root {
    --bg: #0B0F1A; --panel: rgba(20,27,45,0.62); --border: rgba(59,130,246,0.16);
    --text: #E8EEFF; --dim: #8B95AD; --accent: #3B82F6; --accent2: #00D4FF; --violet: #7B61FF;
    --good: #4ade80; --warn: #fbbf24;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background: radial-gradient(900px 500px at 75% -10%, rgba(0,212,255,0.10), transparent 60%),
                radial-gradient(800px 500px at 8% 110%, rgba(123,97,255,0.10), transparent 60%), var(--bg);
    color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .aura { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(600px 300px at 30% 20%, rgba(124,155,255,0.08), transparent 70%); transition: background 4s ease; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: rgba(16,22,38,0.55); backdrop-filter: blur(16px) saturate(140%); z-index: 2; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg,var(--accent2),var(--accent),var(--violet)); display: grid; place-items: center; font-weight: 700; box-shadow: 0 0 24px rgba(0,212,255,0.45); }
  .title { font-size: 15px; font-weight: 600; } .title small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); animation: pulse 2.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .spacer { flex: 1; } .model-chip { font-size: 11px; color: var(--dim); background: var(--panel); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; }
  main { flex: 1; display: flex; min-height: 0; z-index: 1; }
  /* 左侧导航 */
  nav { width: 66px; border-right: 1px solid var(--border); background: rgba(16,22,38,0.5); backdrop-filter: blur(14px); display: flex; flex-direction: column; padding: 10px 8px; gap: 6px; }
  nav button { background: none; border: none; color: var(--dim); padding: 10px 4px; border-radius: 10px; cursor: pointer; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all .2s; }
  nav button:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  nav button.active { color: var(--accent); background: rgba(124,155,255,0.12); }
  nav .ico { font-size: 19px; }
  /* 主内容 */
  .main { flex: 1; display: flex; min-width: 0; }
  .pane { display: none; flex: 1; flex-direction: column; min-width: 0; }
  .pane.active { display: flex; }
  /* 对话 */
  .msgs { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; max-width: 78%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar { width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; font-size: 13px; }
  .msg.xi .avatar { background: linear-gradient(135deg,var(--accent),var(--accent2)); }
  .msg.user .avatar { background: #2a3342; }
  .bubble { padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg.xi .bubble { background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(10px); border-top-left-radius: 3px; }
  .msg.user .bubble { background: linear-gradient(135deg,rgba(0,212,255,0.18),rgba(123,97,255,0.15)); border: 1px solid rgba(0,212,255,0.3); border-top-right-radius: 3px; }
  .inputbar { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); background: rgba(10,14,20,0.7); }
  .inputbar input { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-size: 13.5px; outline: none; }
  .inputbar input:focus { border-color: rgba(124,155,255,0.5); }
  .inputbar button { background: linear-gradient(135deg,var(--accent2),var(--accent),var(--violet)); color: #fff; border: none; padding: 0 20px; border-radius: 10px; font-size: 13.5px; cursor: pointer; font-weight: 600; }
  .inputbar button:disabled { opacity: .5; cursor: wait; }
  /* 列表面板（事件/记忆） */
  .listpane { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
  .ev { display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 13px; }
  .ev .t { font-size: 11px; color: var(--dim); flex-shrink: 0; margin-top: 2px; }
  .ev .c { flex: 1; min-width: 0; }
  .ev .c b { font-size: 12.5px; display: block; margin-bottom: 2px; }
  .ev .c span { font-size: 12px; color: var(--dim); line-height: 1.5; word-break: break-word; }
  .tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: linear-gradient(135deg, rgba(0,212,255,0.18), rgba(123,97,255,0.15)); color: var(--accent2); margin-right: 6px; }
  /* 基因面板 */
  .genes { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .gene { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .gene .nm { font-size: 12.5px; display: flex; justify-content: space-between; margin-bottom: 7px; }
  .gene .nm b { font-weight: 600; } .gene .nm span { color: var(--accent); font-weight: 700; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent2), var(--accent), var(--violet)); }
  /* 右侧生命面板 */
  .side { width: 290px; border-left: 1px solid var(--border); background: rgba(16,22,38,0.5); backdrop-filter: blur(14px); padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; }
  .card h3 { font-size: 11.5px; color: var(--dim); font-weight: 600; margin-bottom: 8px; letter-spacing: .5px; }
  .emo { display: flex; align-items: center; gap: 10px; }
  .emo .ring { width: 42px; height: 42px; border-radius: 50%; background: conic-gradient(var(--accent2) var(--v,70%), rgba(255,255,255,0.07) 0); display: grid; place-items: center; flex-shrink: 0; box-shadow: 0 0 16px rgba(0,212,255,0.2); }
  .emo .ring span { width: 31px; height: 31px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 16px; }
  .emo .t { font-size: 13px; font-weight: 600; } .emo .t small { display: block; color: var(--dim); font-weight: 400; font-size: 11px; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .stat { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; }
  .stat b { font-size: 15px; display: block; } .stat span { font-size: 10px; color: var(--dim); }
  .judgment { font-size: 12px; color: var(--dim); line-height: 1.6; }
  .proposal { font-size: 11.5px; padding: 6px 8px; background: rgba(251,191,36,0.07); border: 1px solid rgba(251,191,36,0.2); border-radius: 8px; margin-bottom: 5px; line-height: 1.5; }
  .proposal b { color: var(--warn); }
  .corr { font-size: 11px; padding: 5px 8px; background: rgba(248,113,113,0.07); border: 1px solid rgba(248,113,113,0.2); border-radius: 8px; margin-bottom: 5px; color: var(--dim); }
  .empty { font-size: 12px; color: #5a6472; padding: 10px; }
  @media (max-width: 900px) { .side { display: none; } }
</style>
</head>
<body>
<div class="aura" id="aura"></div>
<header>
  <div class="logo">曦</div>
  <div class="title">曦<small>AI 生命壳</small></div>
  <div class="live-dot"></div>
  <div class="spacer"></div>
  <div class="model-chip" id="modelChip">…</div>
</header>
<main>
  <nav>
    <button class="active" data-pane="chat"><span class="ico">💬</span>对话</button>
    <button data-pane="events"><span class="ico">🌊</span>事件</button>
    <button data-pane="memory"><span class="ico">🧠</span>记忆</button>
    <button data-pane="genes"><span class="ico">🧬</span>基因</button>
  </nav>
  <div class="main">
    <!-- 对话 -->
    <section class="pane active" id="pane-chat">
      <div class="msgs" id="msgs"></div>
      <div class="inputbar">
        <button id="picBtn" title="发图片（曦能看图）" style="background:none;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-size:16px;cursor:pointer;color:var(--dim)">🖼️</button>
        <input type="file" id="picInput" accept="image/*" hidden>
        <input id="input" placeholder="跟曦说点什么…（Enter 发送）" autocomplete="off">
        <button id="send">发送</button>
      </div>
    </section>
    <!-- 事件流 -->
    <section class="pane" id="pane-events">
      <div class="listpane" id="events"><div class="empty">加载中…</div></div>
    </section>
    <!-- 记忆时间线 -->
    <section class="pane" id="pane-memory">
      <div class="listpane" id="memory"><div class="empty">加载中…</div></div>
    </section>
    <!-- 基因 -->
    <section class="pane" id="pane-genes">
      <div class="genes" id="genes"><div class="empty">加载中…</div></div>
    </section>
  </div>
  <aside class="side">
    <div class="card"><h3>生命状态</h3>
      <div class="emo">
        <div class="ring" id="ring" style="--v:70%"><span id="emo">🛡️</span></div>
        <div class="t" id="emoText">…<small id="emoDetail"></small></div>
      </div>
    </div>
    <div class="card"><h3>记忆</h3><div class="stats" id="stats"></div></div>
    <div class="card"><h3>今日判断</h3><div class="judgment" id="judgment">…</div></div>
    <div class="card"><h3>改进提案</h3><div id="proposals"><div class="empty">…</div></div></div>
    <div class="card"><h3>纠正记忆</h3><div id="corrections"><div class="empty">…</div></div></div>
  </aside>
</main>
<script>
const EMO = { happy:"🌞", calm:"😌", sad:"🌧️", angry:"🔥", anxious:"😟", neutral:"🛡️" };
let state = {}; const $ = (id) => document.getElementById(id);
const fmt = (ts) => { try { return (ts||"").replace("T"," ").slice(5,19); } catch { return ""; } };

function render() {
  const s = state;
  const emo = s.emotion || "neutral";
  $("emo").textContent = EMO[emo] || EMO.neutral;
  const vals = { happy:85, calm:60, neutral:50, sad:30, anxious:40, angry:65 };
  $("ring").style.setProperty("--v", (vals[emo]||50)+"%");
  $("emoText").firstChild.textContent = emo;
  $("emoDetail").textContent = `心跳 ${s.heartbeat} 次${s.recentEmotion ? " · "+s.recentEmotion.slice(0,20) : ""}`;
  $("stats").innerHTML = [["对话记忆",s.dialogue||0],["学习日志",s.learning||0],["共享会话",s.history||0],["真实教训",s.lessons||0]]
    .map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
  $("judgment").textContent = s.judgment || "今天还没有产出判断";
  $("proposals").innerHTML = (s.proposals||[]).length ? s.proposals.map(p=>`<div class="proposal"><b>${p.title}</b><br>${p.suggestion}</div>`).join("") : `<div class="empty">暂无改进提案</div>`;
  $("corrections").innerHTML = (s.corrections||[]).length ? s.corrections.map(c=>`<div class="corr">🚫 ${c.text}</div>`).join("") : `<div class="empty">暂无生效纠正</div>`;
  $("modelChip").textContent = s.model || "?";
}
async function loadState() { try { state = await (await fetch("/api/state")).json(); render(); } catch {} }

async function loadEvents() {
  try {
    const evs = await (await fetch("/api/events")).json();
    $("events").innerHTML = evs.length ? evs.map(e=>`
      <div class="ev"><div class="t">${fmt(e.ts)}</div><div class="c">
        <b>${(e.actions||[]).map(a=>`<span class="tag">${a}</span>`).join("")}${e.emotion||"活动"}</b>
        <span>${e.brief||""}</span></div></div>`).join("") : `<div class="empty">暂无活动（gateway 未跑）</div>`;
  } catch {}
}
async function loadMemory() {
  try {
    const m = await (await fetch("/api/memory")).json();
    const items = [...(m.archive||[]).map(x=>({...x,cat:x.cat})), ...(m.learning||[])].sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
    $("memory").innerHTML = items.length ? items.map(x=>`
      <div class="ev"><div class="t">${fmt(x.ts)}</div><div class="c">
        <b><span class="tag">${x.cat||"记忆"}</span>${(x.text||"").slice(0,60)}</b>
        <span>${x.text||""}</span></div></div>`).join("") : `<div class="empty">记忆档案为空</div>`;
  } catch {}
}
async function loadGenes() {
  try {
    const g = await (await fetch("/api/genes")).json();
    $("genes").innerHTML = g.length ? g.map(x=>`
      <div class="gene"><div class="nm"><b>${x.name}</b><span>${(x.value*100).toFixed(0)}%</span></div>
      <div class="bar"><i style="width:${(x.value*100).toFixed(0)}%"></i></div></div>`).join("") : `<div class="empty">基因数据为空</div>`;
  } catch {}
}

// tab 切换
document.querySelectorAll("nav button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".pane").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    $("pane-" + btn.dataset.pane).classList.add("active");
    if (btn.dataset.pane === "events") loadEvents();
    if (btn.dataset.pane === "memory") loadMemory();
    if (btn.dataset.pane === "genes") loadGenes();
  };
});

function addMsg(role, text) {
  const w = document.createElement("div");
  w.className = "msg " + role;
  w.innerHTML = `<div class="avatar">${role==="xi"?"曦":"我"}</div><div class="bubble"></div>`;
  w.querySelector(".bubble").textContent = text;
  $("msgs").appendChild(w); $("msgs").scrollTop = $("msgs").scrollHeight;
}
let pendingImage = null;
$("picBtn").onclick = () => $("picInput").click();
$("picInput").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    pendingImage = String(r.result).split(",")[1] || null;
    addMsg("user", "[图片] " + f.name + (pendingImage ? "" : "（读取失败）"));
    if (!pendingImage) pendingImage = null;
  };
  r.readAsDataURL(f);
  e.target.value = "";
});
async function send() {
  const input = $("input"); const q = input.value.trim();
  if (!q && !pendingImage) return;
  input.value = ""; addMsg("user", q || "[图片]");
  const img = pendingImage; pendingImage = null;
  $("send").disabled = true; $("send").textContent = "思考中…";
  try {
    const d = await (await fetch("/api/chat", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ message:q, image:img }) })).json();
    addMsg("xi", d.reply || "（曦没回应）"); loadState();
  } catch (e) { addMsg("xi", "⚠️ 连接失败: "+e.message); }
  $("send").disabled = false; $("send").textContent = "发送";
}
$("send").onclick = send;
$("input").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
document.addEventListener("mousemove", e => { const a=$("aura"); a.style.setProperty("--ax", e.clientX/innerWidth*100+"%"); a.style.setProperty("--ay", e.clientY/innerHeight*100+"%"); });
loadState(); setInterval(loadState, 15000);
addMsg("xi", "我在。");
</script>
</body>
</html>
