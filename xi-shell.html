<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>曦 · AI 生命壳</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: rgba(18, 24, 34, 0.85);
    --border: rgba(255,255,255,0.08);
    --text: #e8ecf2;
    --dim: #8b95a5;
    --accent: #7c9bff;
    --accent2: #a78bfa;
    --good: #4ade80;
    --warn: #fbbf24;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1200px 800px at 70% -10%, rgba(124,155,255,0.12), transparent 60%),
                radial-gradient(900px 600px at 10% 110%, rgba(167,139,250,0.10), transparent 60%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* 呼吸光（生命感） */
  .aura {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(600px 300px at var(--ax, 30%) var(--ay, 20%), rgba(124,155,255,0.08), transparent 70%);
    transition: background 4s ease;
  }
  /* 顶栏 */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: rgba(10,14,20,0.6); backdrop-filter: blur(10px);
    z-index: 2;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-weight: 700; font-size: 15px;
    box-shadow: 0 0 20px rgba(124,155,255,0.4);
  }
  .title { font-size: 15px; font-weight: 600; }
  .title small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); animation: pulse 2.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .spacer { flex: 1; }
  .model-chip { font-size: 11px; color: var(--dim); background: var(--panel); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; }
  /* 主布局 */
  main { flex: 1; display: flex; min-height: 0; z-index: 1; }
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .msgs { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; max-width: 78%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar { width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; font-size: 13px; }
  .msg.xi .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .msg.user .avatar { background: #2a3342; }
  .bubble { padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg.xi .bubble { background: var(--panel); border: 1px solid var(--border); border-top-left-radius: 3px; }
  .msg.user .bubble { background: linear-gradient(135deg, rgba(124,155,255,0.25), rgba(167,139,250,0.2)); border: 1px solid rgba(124,155,255,0.3); border-top-right-radius: 3px; }
  .inputbar { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); background: rgba(10,14,20,0.7); }
  .inputbar input {
    flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; color: var(--text); font-size: 13.5px; outline: none;
  }
  .inputbar input:focus { border-color: rgba(124,155,255,0.5); }
  .inputbar button {
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none;
    padding: 0 20px; border-radius: 10px; font-size: 13.5px; cursor: pointer; font-weight: 600;
  }
  .inputbar button:disabled { opacity: 0.5; cursor: wait; }
  /* 右侧生命面板 */
  .side {
    width: 300px; border-left: 1px solid var(--border); background: rgba(12,17,25,0.7);
    padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .card h3 { font-size: 12px; color: var(--dim); font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; }
  .emo { display: flex; align-items: center; gap: 10px; }
  .emo .ring {
    width: 44px; height: 44px; border-radius: 50%;
    background: conic-gradient(var(--accent) var(--v, 70%), rgba(255,255,255,0.06) 0);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .emo .ring span { width: 32px; height: 32px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 17px; }
  .emo .t { font-size: 13px; font-weight: 600; }
  .emo .t small { display: block; color: var(--dim); font-weight: 400; font-size: 11px; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .stat b { font-size: 16px; display: block; }
  .stat span { font-size: 10.5px; color: var(--dim); }
  .judgment { font-size: 12.5px; color: var(--dim); line-height: 1.6; }
  .proposal { font-size: 12px; padding: 7px 9px; background: rgba(251,191,36,0.07); border: 1px solid rgba(251,191,36,0.2); border-radius: 8px; margin-bottom: 6px; line-height: 1.5; }
  .proposal b { color: var(--warn); }
  .corr { font-size: 11.5px; padding: 6px 9px; background: rgba(248,113,113,0.07); border: 1px solid rgba(248,113,113,0.2); border-radius: 8px; margin-bottom: 5px; color: var(--dim); }
  .empty { font-size: 12px; color: #5a6472; }
  @media (max-width: 760px) { .side { display: none; } }
</style>
</head>
<body>
<div class="aura" id="aura"></div>
<header>
  <div class="logo">曦</div>
  <div class="title">曦<small>AI 生命壳 · XI Life Shell</small></div>
  <div class="live-dot"></div>
  <div class="spacer"></div>
  <div class="model-chip" id="modelChip">…</div>
</header>
<main>
  <div class="chat">
    <div class="msgs" id="msgs"></div>
    <div class="inputbar">
      <input id="input" placeholder="跟曦说点什么…（Enter 发送）" autocomplete="off">
      <button id="send">发送</button>
    </div>
  </div>
  <aside class="side">
    <div class="card">
      <h3>生命状态</h3>
      <div class="emo">
        <div class="ring" id="ring" style="--v:70%"><span id="emo">🛡️</span></div>
        <div class="t" id="emoText">…<small id="emoDetail"></small></div>
      </div>
    </div>
    <div class="card">
      <h3>记忆</h3>
      <div class="stats" id="stats"></div>
    </div>
    <div class="card"><h3>今日判断</h3><div class="judgment" id="judgment">…</div></div>
    <div class="card"><h3>改进提案</h3><div id="proposals"><div class="empty">加载中…</div></div></div>
    <div class="card"><h3>纠正记忆</h3><div id="corrections"><div class="empty">加载中…</div></div></div>
  </aside>
</main>
<script>
const EMO = { happy: "🌞", calm: "😌", sad: "🌧️", angry: "🔥", anxious: "😟", neutral: "🛡️" };
let state = {};
const $ = (id) => document.getElementById(id);

function render() {
  const s = state;
  // 情绪
  const emo = s.emotion || "neutral";
  $("emo").textContent = EMO[emo] || EMO.neutral;
  const vals = { happy: 85, calm: 60, neutral: 50, sad: 30, anxious: 40, angry: 65 };
  $("ring").style.setProperty("--v", (vals[emo] || 50) + "%");
  $("emoText").firstChild.textContent = emo;
  $("emoDetail").textContent = `心跳 ${s.heartbeat} 次${s.recentEmotion ? " · " + s.recentEmotion.slice(0, 20) : ""}`;
  // 记忆
  $("stats").innerHTML = [
    ["对话记忆", s.dialogue || 0], ["学习日志", s.learning || 0],
    ["共享会话", s.history || 0], ["真实教训", s.lessons || 0],
  ].map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
  // 判断
  $("judgment").textContent = s.judgment || "今天还没有产出判断";
  // 提案
  $("proposals").innerHTML = (s.proposals || []).length
    ? s.proposals.map((p) => `<div class="proposal"><b>${p.title}</b><br>${p.suggestion}</div>`).join("")
    : `<div class="empty">暂无改进提案</div>`;
  // 纠正
  $("corrections").innerHTML = (s.corrections || []).length
    ? s.corrections.map((c) => `<div class="corr">🚫 ${c.text}</div>`).join("")
    : `<div class="empty">暂无生效纠正</div>`;
  $("modelChip").textContent = s.model || "?";
}

async function loadState() {
  try {
    const r = await fetch("/api/state");
    state = await r.json();
    render();
  } catch {}
}

function addMsg(role, text) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  wrap.innerHTML = `<div class="avatar">${role === "xi" ? "曦" : "我"}</div><div class="bubble"></div>`;
  wrap.querySelector(".bubble").textContent = text;
  $("msgs").appendChild(wrap);
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

async function send() {
  const input = $("input");
  const q = input.value.trim();
  if (!q) return;
  input.value = ""; addMsg("user", q);
  $("send").disabled = true; $("send").textContent = "思考中…";
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: q }) });
    const d = await r.json();
    addMsg("xi", d.reply || "（曦没回应）");
    loadState();
  } catch (e) { addMsg("xi", "⚠️ 连接失败: " + e.message); }
  $("send").disabled = false; $("send").textContent = "发送";
}

$("send").onclick = send;
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
// 呼吸光随鼠标
document.addEventListener("mousemove", (e) => {
  const a = $("aura");
  a.style.setProperty("--ax", e.clientX / innerWidth * 100 + "%");
  a.style.setProperty("--ay", e.clientY / innerHeight * 100 + "%");
});
loadState();
setInterval(loadState, 15000); // 每 15s 刷新生命状态
addMsg("xi", "我在。");
</script>
</body>
</html>
